name: Android Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: source
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - namate: Extract uploaded source
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p source
          unzip -q PBG-GitHub-APK-Build.zip -d source
          test -f source/package-lock.json
          test -f source/app.json

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --include=dev

      - name: TypeScript check
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Validate test signing
        run: node scripts/check-test-signing.cjs

      - name: Build installable APK with bundled JavaScript
        working-directory: source/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g'

      - name: Verify and collect APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/PB-Ranked-test.apk
          test -s artifacts/PB-Ranked-test.apk
          sha256sum artifacts/PB-Ranked-test.apk > artifacts/SHA256SUMS.txt
          echo '## Android Test APK' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download **PB-Ranked-test-apk** from the artifacts section below.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Test-signed, not for Google Play. Requires internet and a public hosted game.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK download
        uses: actions/upload-artifact@v4
        with:
          name: PB-Ranked-test-apk
          path: source/artifacts/
          if-no-files-found: error
          retention-days: 14
