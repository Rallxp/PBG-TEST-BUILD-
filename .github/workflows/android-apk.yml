name: PokeFightz Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package is no longer served by Google.
          packages: platform-tools

      - name: Install dependencies
        run: npm ci --include=dev

      - name: TypeScript check
        run: npm run typecheck

      - name: Generate Android project on GitHub runner
        run: npx expo prebuild --platform android --no-install --clean

      - name: Validate test signing
        run: node scripts/check-test-signing.cjs

      - name: Build installable APK with bundled JavaScript
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g'

      - name: Verify and collect APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/PokeFightz-test.apk
          sha256sum artifacts/PokeFightz-test.apk > artifacts/SHA256SUMS.txt
          echo '## PokeFightz Android APK' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download **PokeFightz-test-apk** from the artifacts section below.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Signed with a test key; not suitable for Google Play. Requires internet access and a public hosted clone.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK download
        uses: actions/upload-artifact@v4
        with:
          name: PokeFightz-test-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 14